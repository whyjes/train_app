name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Init and Build
        run: |
          # 1. 备份你仓库里写的 main.dart (防止被 flutter create 覆盖)
          mkdir -p backup
          cp lib/main.dart backup/main.dart
          cp pubspec.yaml backup/pubspec.yaml

          # 2. 生成工程结构
          flutter create --platforms android --org com.train.query .
          
          # 3. 【核心步骤】把正确代码强行换回去
          cp -f backup/main.dart lib/main.dart
          cp -f backup/pubspec.yaml pubspec.yaml
          
          # 4. 再次检查数据文件夹
          mkdir -p assets
          [ -f assets/data.csv ] || touch assets/data.csv
          
          # 5. 编译
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: train-query-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
